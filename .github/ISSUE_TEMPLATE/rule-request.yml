name: Suggest a check
description: A release mistake or key format release-lint should catch
labels: [rule-request]
body:
  - type: textarea
    id: mistake
    attributes:
      label: What went wrong (or almost did)?
      placeholder: We shipped a build where …
    validations:
      required: true
  - type: textarea
    id: detect
    attributes:
      label: How could it be detected in the built file?
      description: A key prefix, a manifest attribute, a plist key, a file name … Use fake values only.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iOS, Android, Both]
