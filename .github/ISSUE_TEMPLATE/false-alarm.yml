name: False alarm
description: release-lint reported something in your app that is fine
labels: [false-alarm]
body:
  - type: markdown
    attributes:
      value: Thanks! False alarms are the most useful reports. Never attach the app file; the finding is enough.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: host/non-production
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste it from the report (secrets are already masked). Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it fine?
      placeholder: This host is our production CDN / this string comes from library X …
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: App setup
      placeholder: Expo SDK 58, React Native 0.88, EAS build, .aab
